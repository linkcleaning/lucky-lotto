name: 로또 당첨번호 업데이트

on:
  schedule:
    # 토요일 20:50, 21:30 KST (추첨 20:35 직후) + 일요일 09:00 KST 재확인
    - cron: '50 11 * * 6'
    - cron: '30 12 * * 6'
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      backfill:
        description: '처음 실행할 때 채울 최근 회차 수'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 당첨번호 받아오기
        env:
          BACKFILL: ${{ github.event.inputs.backfill || '30' }}
        run: node scripts/update-draws.mjs

      - name: 바뀐 내용 저장
        run: |
          if git diff --quiet -- data/draws.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          git commit -m "로또 당첨번호 업데이트"
          git push
